<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tam — Telegram Mini App MVP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #1a1d24;
      --panel-soft: #232733;
      --accent: #3a7bfd;
      --accent-soft: rgba(58, 123, 253, 0.2);
      --text: #f5f7ff;
      --muted: #9ba4bc;
      --border: #2c313f;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 520px;
      margin: 0 auto;
      background: linear-gradient(180deg, #171b24 0%, #0f1115 30%);
    }

    .topbar {
      padding: calc(10px + var(--safe-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(14px);
    }

    .brand { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
    .tg-status {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .view {
      overflow: auto;
      display: none;
      padding-bottom: 14px;
    }
    .view.active { display: block; }

    .stories {
      display: flex;
      gap: 12px;
      overflow: auto;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .story {
      min-width: 68px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }
    .story-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 6px;
      padding: 2px;
      background: linear-gradient(140deg, #5ea0ff, #8f67ff);
    }
    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #12151c;
    }

    .feed-list { padding: 12px 12px 0; display: grid; gap: 12px; }
    .post {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
    }
    .post-head { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .post-author { font-weight: 600; font-size: 15px; }
    .post-meta { font-size: 12px; color: var(--muted); }
    .post-text { margin: 10px 0 8px; line-height: 1.35; }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip {
      font-size: 12px;
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .chip.accent { background: var(--accent-soft); color: #c9d9ff; border-color: rgba(58, 123, 253, 0.55); }

    .post-photo {
      width: 100%;
      border-radius: 12px;
      max-height: 210px;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .actions { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
    .comment-button {
      margin-top: 10px;
      width: 100%;
      background: transparent;
      color: #c2d2ff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }

    .comments {
      margin-top: 8px;
      background: #141822;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 8px;
      display: none;
      gap: 6px;
    }
    .comments.open { display: grid; }
    .comment-item { font-size: 13px; color: #d9e1f7; }
    .comment-item b { color: #ffffff; }

    .geochat {
      margin: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 16px;
      padding: 12px;
    }
    .geochat h3 { margin: 0 0 10px; font-size: 15px; }
    .geochat-log { display: grid; gap: 6px; margin-bottom: 10px; max-height: 120px; overflow: auto; }
    .chat-line { background: #171b25; border-radius: 10px; padding: 8px; font-size: 13px; color: #d7dff7; }
    .chat-compose { display: flex; gap: 8px; }
    .chat-compose input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #11141c;
      color: var(--text);
      padding: 8px;
    }
    .chat-compose button {
      border: none;
      background: var(--accent);
      color: white;
      border-radius: 10px;
      padding: 8px 12px;
    }

    #map {
      height: calc(100% - 14px);
      margin: 0 12px 0;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .profile {
      padding: 14px 12px 0;
      display: grid;
      gap: 12px;
    }
    .profile-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }
    .profile-head { display: flex; gap: 10px; align-items: center; }
    .profile-name { font-size: 18px; font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat { background: #171b25; border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      background: rgba(14,16,21,0.95);
      padding-bottom: calc(8px + var(--safe-bottom));
      padding-top: 8px;
    }
    .tab {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 12px;
      display: grid;
      gap: 4px;
      justify-items: center;
      cursor: pointer;
    }
    .tab.active { color: #d7e2ff; }
    .tab-icon { font-size: 18px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Tam</div>
      <div class="tg-status" id="tgStatus">Telegram Mini App: preview</div>
    </header>

    <main>
      <section class="view active" data-view="feed">
        <div class="stories" id="stories"></div>
        <div class="feed-list" id="feed"></div>

        <section class="geochat">
          <h3>Геочат рядом с тобой</h3>
          <div class="geochat-log" id="geoLog"></div>
          <div class="chat-compose">
            <input id="geoInput" placeholder="Написать в локальный чат" maxlength="120" />
            <button id="geoSend">Send</button>
          </div>
        </section>
      </section>

      <section class="view" data-view="map">
        <div id="map"></div>
      </section>

      <section class="view" data-view="profile">
        <div class="profile">
          <article class="profile-card">
            <div class="profile-head">
              <img class="avatar" src="https://randomuser.me/api/portraits/men/77.jpg" alt="me" />
              <div>
                <div class="profile-name">Ты в Tam</div>
                <div class="post-meta">MVP profile для Telegram 2026 iOS</div>
              </div>
            </div>
            <div class="stats">
              <div class="stat"><div>12</div><small>Постов</small></div>
              <div class="stat"><div>58</div><small>Комментарии</small></div>
              <div class="stat"><div>4.8</div><small>Рейтинг</small></div>
            </div>
          </article>

          <article class="profile-card">
            <strong>Интеграция Mini App на старте:</strong>
            <ul>
              <li>Инициализация через Telegram.WebApp.ready()</li>
              <li>Получение пользователя из initDataUnsafe</li>
              <li>Поддержка темы и safe-area iOS</li>
            </ul>
          </article>
        </div>
      </section>
    </main>

    <nav class="tabs">
      <button class="tab active" data-tab="feed"><span class="tab-icon">📰</span><span>Лента</span></button>
      <button class="tab" data-tab="map"><span class="tab-icon">🗺️</span><span>Карта</span></button>
      <button class="tab" data-tab="profile"><span class="tab-icon">👤</span><span>Профиль</span></button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const escapeHTML = (value = "") => {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    };

    const storiesEl = document.getElementById("stories");
    const feedEl = document.getElementById("feed");
    const geoLog = document.getElementById("geoLog");
    const geoInput = document.getElementById("geoInput");
    const geoSend = document.getElementById("geoSend");

    const geoMessages = [
      "Тимур: Кто на Невском?",
      "Ирина: Есть зарядка lightning?",
      "Ты: Через 10 минут буду у метро"
    ];

    function renderGeoMessages() {
      geoLog.innerHTML = geoMessages.map((text) => `<div class="chat-line">${escapeHTML(text)}</div>`).join("");
      geoLog.scrollTop = geoLog.scrollHeight;
    }

    function toggleComments(id) {
      const comments = document.getElementById(`comments-${id}`);
      if (comments) {
        comments.classList.toggle("open");
      }
    }

    const map = L.map("map", { zoomControl: false }).setView([55.75, 37.62], 10);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap contributors &copy; CartoDB",
      maxZoom: 19
    }).addTo(map);

    function buildPost(post) {
      const hasPhoto = post.photo ? `<img class="post-photo" src="${post.photo}" alt="post photo">` : "";
      const comments = (post.comments || []).slice(0, 3);
      const commentsList = comments.length
        ? comments.map((c) => `<div class="comment-item"><b>${escapeHTML(c.author)}:</b> ${escapeHTML(c.text)}</div>`).join("")
        : '<div class="comment-item">Пока нет комментариев</div>';

      return `
        <article class="post">
          <div class="post-head">
            <img class="avatar" src="${post.avatar}" alt="${escapeHTML(post.author)}" />
            <div>
              <div class="post-author">${escapeHTML(post.author)}</div>
              <div class="post-meta">${post.time} · ${post.views} просмотров</div>
            </div>
          </div>
          <div class="post-text">${escapeHTML(post.text)}</div>
          <div class="chip-row">
            <span class="chip accent">📍 ${post.lat.toFixed(3)}, ${post.lng.toFixed(3)}</span>
            <span class="chip">🔗 Привязано к кружку</span>
          </div>
          ${hasPhoto}
          <div class="actions">
            <span>❤️ ${post.likes || 0}</span>
            <span>⭐ ${post.stars || 0}</span>
          </div>
          <button class="comment-button" onclick="toggleComments(${post.id})">💬 Комментарии открываются мягко</button>
          <div class="comments" id="comments-${post.id}">${commentsList}</div>
        </article>
      `;
    }

    function renderStories(posts) {
      const unique = [];
      const seen = new Set();
      posts.forEach((item) => {
        if (!seen.has(item.author)) {
          seen.add(item.author);
          unique.push(item);
        }
      });

      storiesEl.innerHTML = unique.slice(0, 10).map((item) => `
        <div class="story">
          <div class="story-ring"><img src="${item.avatar}" alt="${escapeHTML(item.author)}" /></div>
          <div>${escapeHTML(item.author)}</div>
        </div>
      `).join("");
    }

    function renderFeed(posts) {
      const selected = posts.slice(0, 8);
      feedEl.innerHTML = selected.map(buildPost).join("");
      selected.forEach((post) => {
        L.marker([post.lat, post.lng]).addTo(map).bindPopup(`
          <b>${escapeHTML(post.author)}</b><br>
          ${escapeHTML(post.text)}<br>
          <small>Пост привязан к локации</small>
        `);
      });
    }

    fetch("messages.json")
      .then((res) => res.json())
      .then((posts) => {
        renderStories(posts);
        renderFeed(posts);
      })
      .catch(() => {
        feedEl.innerHTML = "<p style='padding:12px;color:#9ba4bc'>Не удалось загрузить ленту.</p>";
      });

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        const tab = button.dataset.tab;
        document.querySelectorAll(".tab").forEach((item) => item.classList.toggle("active", item === button));
        document.querySelectorAll(".view").forEach((view) => view.classList.toggle("active", view.dataset.view === tab));
        if (tab === "map") {
          setTimeout(() => map.invalidateSize(), 80);
        }
      });
    });

    geoSend.addEventListener("click", () => {
      const text = geoInput.value.trim();
      if (!text) return;
      geoMessages.push(`Ты: ${text}`);
      geoInput.value = "";
      renderGeoMessages();
    });

    geoInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        geoSend.click();
      }
    });

    const tgStatus = document.getElementById("tgStatus");
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      tgStatus.textContent = user ? `Telegram: @${user.username || user.first_name || "user"}` : "Telegram Mini App: connected";
    }

    renderGeoMessages();
    window.toggleComments = toggleComments;
  </script>
</body>
</html>
